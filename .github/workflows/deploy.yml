name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://l4place0.github.io' }}
  BASE_PATH: ${{ vars.BASE_PATH || '/l4p-blog' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and solutions
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: pnpm@11

  deploy:
    if: vars.PAGES_DEPLOY_MODE == 'actions'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
